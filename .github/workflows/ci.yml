name: ci

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: embedder

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The daemon's suite does not need the model: parity and HTTP tests in the embedder
      # crate skip loudly when the weights are absent.
      - name: Test the daemon
        run: cargo test --workspace

      - name: Cache the model weights
        uses: actions/cache@v4
        with:
          path: embedder/weights
          key: uibk-embedding-v1-b18df82e

      - name: Fetch the model weights
        run: scripts/fetch_weights.sh

      - name: Test the embedder, including parity against the reference embeddings
        run: cargo test
        working-directory: embedder

  images:
    name: build images
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the daemon image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.adrian
          push: false
          tags: adrian:ci

      - name: Cache the model weights for the image build
        uses: actions/cache@v4
        with:
          path: embedder/weights
          key: uibk-embedding-v1-b18df82e

      - name: Fetch the model weights
        run: scripts/fetch_weights.sh

      - name: Build the embedder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.embedder
          push: false
          tags: adrian-embedder:ci
