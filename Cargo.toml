[workspace]
resolver = "2"
members = ["crates/adrian-core", "crates/adrian-api", "crates/adrian-bin"]
# The embedder is a separate workspace on purpose: `cargo test` on adrian must not have to
# compile candle, and the embedder image only needs its own crate graph.
exclude = ["embedder"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Adrian contributors"]
repository = "https://github.com/HanzCEO/adrian"

[workspace.dependencies]
adrian-core = { path = "crates/adrian-core" }
adrian-api = { path = "crates/adrian-api" }

tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync", "fs"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors", "limit"] }
hyper = "1"
http-body-util = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.42", features = ["bundled", "uuid", "functions"] }
r2d2 = "0.8"
r2d2_sqlite = "0.37"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "charset", "http2"] }
regex = "1"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
globset = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
base64 = "0.22"
